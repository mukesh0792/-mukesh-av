name: Apply Phase 1 QA fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: Phase 1 QA corrections'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply approved fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # ---------- index.html ----------
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')

          old = '''<button onclick="window.print()" class="px-3.5 py-2 text-xs font-mono font-semibold uppercase tracking-wider bg-gradient-to-r from-cyan-500 to-amber-500 text-slate-950 font-bold rounded-lg hover:opacity-95 shadow-md shadow-cyan-500/20 transition-all flex items-center gap-1.5">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i>
          PDF Resume
        </button>'''
          new = '''<a href="resume.pdf" target="_blank" rel="noopener" class="px-3.5 py-2 text-xs font-mono font-semibold uppercase tracking-wider bg-gradient-to-r from-cyan-500 to-amber-500 text-slate-950 font-bold rounded-lg hover:opacity-95 shadow-md shadow-cyan-500/20 transition-all flex items-center gap-1.5">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          PDF Resume
        </a>'''
          if old in s:
              s = s.replace(old, new, 1)

          old_mobile = '''<button id="mobile-menu-btn" class="md:hidden text-slate-300 hover:text-white p-2" aria-label="Toggle Navigation">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>'''
          new_mobile = '''<button id="mobile-menu-btn" type="button" class="md:hidden w-11 h-11 rounded-lg border border-slate-700 bg-slate-900/90 text-slate-200 hover:text-white hover:border-cyan-500/50 flex items-center justify-center shadow-lg" aria-label="Toggle Navigation" aria-controls="mobile-menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>'''
          if old_mobile in s:
              s = s.replace(old_mobile, new_mobile, 1)

          old_print = '''<button onclick="window.print()" class="w-full text-center py-2 text-xs font-mono uppercase border border-slate-700 text-slate-300 font-bold rounded-md">
            Print Profile
          </button>'''
          new_print = '''<a href="resume.pdf" target="_blank" rel="noopener" class="w-full text-center py-2 text-xs font-mono uppercase border border-slate-700 text-slate-300 font-bold rounded-md">
            PDF Resume
          </a>'''
          if old_print in s:
              s = s.replace(old_print, new_print, 1)

          s = s.replace('ALL (11)', 'ALL (9)')
          s = s.replace('Master Fleet Telemetry', 'Fleet Telemetry Demo')
          s = s.replace('LIVE TELEMETRY', 'SIMULATED TELEMETRY')
          s = s.replace('Status: ACTIVE TELEMETRY', 'Status: DEMO TELEMETRY')
          # Change only the telemetry badge token where present.
          s = s.replace('>ONLINE</span>', '>DEMO</span>', 1)

          p.write_text(s, encoding='utf-8')

          # ---------- app.js ----------
          p = root / 'app.js'
          s = p.read_text(encoding='utf-8')

          old_lens = re.compile(r"if \(throwRatio < 1\.20\) \{.*?\n\s*\} else \{\n\s*lensName = 'Barco Ultra-Long Throw Optical System \(4\.30 - 6\.00:1\)';.*?\n\s*\}", re.S)
          new_lens = '''const lensOptions = [
          { min: 0.80, max: 1.16, name: 'Barco Ultra-Short Throw DCI Lens (0.80 - 1.16:1)', desc: 'Ultra-short throw optics for compact cinema rooms.' },
          { min: 1.20, max: 1.70, name: 'Barco High-Brightness Motorized Lens (1.20 - 1.70:1)', desc: 'High-brightness motorized lens for mid-short throw installations.' },
          { min: 1.38, max: 2.05, name: 'Barco High-Performance Zoom Lens (1.38 - 2.05:1)', desc: 'High-performance zoom lens for typical cinema throw ranges.' },
          { min: 1.70, max: 2.50, name: 'Barco High-Contrast Cinema Lens (1.70 - 2.50:1)', desc: 'High-contrast cinema optics for longer throw ratios.' },
          { min: 2.20, max: 3.20, name: 'Barco Long-Throw Motorized Lens (2.20 - 3.20:1)', desc: 'Long-throw motorized cinema lens.' },
          { min: 3.00, max: 4.30, name: 'Barco Extra-Long Throw Cinema Lens (3.00 - 4.30:1)', desc: 'Extra-long throw cinema optics.' },
          { min: 4.30, max: 6.00, name: 'Barco Ultra-Long Throw Optical System (4.30 - 6.00:1)', desc: 'Ultra-long throw optical system.' }
        ];

        const lens = lensOptions.find(item => throwRatio >= item.min && throwRatio <= item.max);

        if (!lens) {
          lensName = 'No Supported Barco Lens Match';
          lensDescription = `Throw ratio ${throwRatio.toFixed(2)}:1 is outside the supported ranges shown by this tool. Verify the exact projector/lens combination against Barco documentation.`;
          resultName.classList.add('text-rose-300');
        } else {
          lensName = lens.name;
          lensDescription = lens.desc;
          resultName.classList.remove('text-rose-300');
        }'''
          m = old_lens.search(s)
          if m:
              s = s[:m.start()] + new_lens + s[m.end():]
          else:
              raise SystemExit('Lens recommendation block not found; aborting without commit.')

          # Keep the navigation state accessible to assistive tech.
          s = s.replace("mobileMenuBtn.addEventListener('click', () => {\n      mobileMenu.classList.toggle('hidden');", "mobileMenuBtn.addEventListener('click', () => {\n      mobileMenu.classList.toggle('hidden');\n      mobileMenuBtn.setAttribute('aria-expanded', String(!mobileMenu.classList.contains('hidden')));")
          s = s.replace("mobileMenu.querySelectorAll('a').forEach(link => {\n      link.addEventListener('click', () => {\n        mobileMenu.classList.add('hidden');", "mobileMenu.querySelectorAll('a').forEach(link => {\n      link.addEventListener('click', () => {\n        mobileMenu.classList.add('hidden');\n        mobileMenuBtn.setAttribute('aria-expanded', 'false');")

          p.write_text(s, encoding='utf-8')

          # ---------- styles.css ----------
          p = root / 'styles.css'
          s = p.read_text(encoding='utf-8')

          anchor_css = '''\n/* Phase 1 QA: keep anchor targets clear of the fixed header. */\nhtml {\n  scroll-padding-top: 88px;\n}\n\nsection[id], footer[id] {\n  scroll-margin-top: 88px;\n}\n\n@media (max-width: 767px) {\n  #mobile-menu {\n    max-height: calc(100vh - 80px);\n    overflow-y: auto;\n  }\n\n  .terminal-body {\n    overflow-x: hidden;\n  }\n\n  .terminal-window .log-entry {\n    display: block;\n    padding: 8px 0;\n  }\n\n  .terminal-window .log-entry > * {\n    max-width: 100%;\n    overflow-wrap: anywhere;\n    word-break: break-word;\n  }\n\n  .terminal-window .log-entry > :last-child {\n    display: block;\n    margin-top: 4px;\n    white-space: normal;\n  }\n}\n'''
          if 'Phase 1 QA: keep anchor targets clear of the fixed header.' not in s:
              s += anchor_css
          p.write_text(s, encoding='utf-8')

          # ---------- basic assertions ----------
          idx = (root / 'index.html').read_text(encoding='utf-8')
          js = (root / 'app.js').read_text(encoding='utf-8')
          css = (root / 'styles.css').read_text(encoding='utf-8')
          assert 'href="resume.pdf"' in idx
          assert 'aria-expanded="false"' in idx
          assert 'No Supported Barco Lens Match' in js
          assert 'scroll-padding-top: 88px' in css
          assert 'ALL (11)' not in idx

      - name: Commit fixes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js styles.css
          git commit -m "fix: Phase 1 QA corrections"
          rm -f .github/workflows/phase1-qa-fix.yml
          git add -A
          git commit -m "chore: remove one-time Phase 1 QA workflow"
          git push
