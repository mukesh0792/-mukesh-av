name: Apply Phase 1B Functional QA Fixes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 scripts/apply_phase1b.py
      - name: Verify
        run: |
          grep -Fq 'href="resume.pdf"' index.html
          grep -Fq 'No Supported Barco Lens Match' app.js
          grep -Fq 'const supportedLensRanges' app.js
          grep -Fq 'window.print()' index.html
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js
          git commit -m 'fix: Phase 1B Barco range and resume behavior'
          git rm .github/workflows/apply-phase1b.yml scripts/apply_phase1b.py
          git commit -m 'chore: remove one-time Phase 1B fixer'
          git push origin main
